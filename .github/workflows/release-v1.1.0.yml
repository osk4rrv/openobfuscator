name: Release v1.1.0

on:
  push:
    branches:
      - release/v1.1.0

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DOPENOBFUSCATOR_REQUIRE_LUAJIT_TESTS=ON
      - name: Build and test
        run: cmake --build build --parallel 2 && ctest --test-dir build --output-on-failure
      - name: Package
        run: cpack --config build/CPackConfig.cmake -B dist
      - uses: actions/upload-artifact@v4
        with:
          name: OpenObfuscator-1.1.0-Linux
          path: dist/OpenObfuscator-1.1.0-Linux.zip
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=OFF
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release -B dist
      - uses: actions/upload-artifact@v4
        with:
          name: OpenObfuscator-1.1.0-win64
          path: dist/OpenObfuscator-1.1.0-win64.zip
          if-no-files-found: error

  release:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: sha256sum release-assets/*.zip > release-assets/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v1.1.0 release-assets/* --clobber --repo "${{ github.repository }}"
          else
            gh release create v1.1.0 release-assets/* \
              --target "${{ github.sha }}" \
              --title "V1.1" \
              --generate-notes \
              --repo "${{ github.repository }}"
          fi
