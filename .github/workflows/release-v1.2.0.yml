name: Release v1.2.0

on:
  push:
    branches:
      - release/v1.2.0

concurrency:
  group: release-v1.2.0
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DOPENOBFUSCATOR_REQUIRE_LUAJIT_TESTS=ON
      - name: Build and test
        run: cmake --build build --parallel 2 && ctest --test-dir build --output-on-failure
      - name: Validate JavaScript runtime
        run: |
          printf '%s\n' "const fs=require('node:fs'); if(this!==module.exports) throw new Error('CommonJS this mismatch'); const _format=7; fs.writeFileSync('build/javascript-result.txt',String(_format)); return;" > build/javascript-fixture.cjs
          ./build/openobfuscator --language javascript build/javascript-fixture.cjs build/javascript-protected.cjs
          node build/javascript-protected.cjs
          test "$(cat build/javascript-result.txt)" = "7"
      - name: Package
        run: cpack --config build/CPackConfig.cmake -B dist
      - uses: actions/upload-artifact@v4
        with:
          name: OpenObfuscator-1.2.0-Linux
          path: dist/OpenObfuscator-1.2.0-Linux.zip
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=OFF
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release -B dist
      - uses: actions/upload-artifact@v4
        with:
          name: OpenObfuscator-1.2.0-win64
          path: dist/OpenObfuscator-1.2.0-win64.zip
          if-no-files-found: error

  release:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum *.zip > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.2.0 release-assets/* \
            --target "${{ github.sha }}" \
            --title "V1.2" \
            --notes "Added support for JavaScript code." \
            --repo "${{ github.repository }}"
